name: Debug ASC API (temporal)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Listar todos los beta groups de la app
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_APP_ID: '6773713987'
        run: |
          cat > /tmp/list_groups.js << 'NODEEOF'
          const crypto = require('crypto');

          function base64url(input) {
            return Buffer.from(input).toString('base64').replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
          }

          function genJwt() {
            const keyObject = crypto.createPrivateKey(process.env.ASC_API_KEY_P8);
            const header = { alg: 'ES256', kid: process.env.ASC_API_KEY_ID, typ: 'JWT' };
            const now = Math.floor(Date.now() / 1000);
            const payload = { iss: process.env.ASC_API_ISSUER_ID, iat: now, exp: now + 1190, aud: 'appstoreconnect-v1' };
            const unsigned = base64url(JSON.stringify(header)) + '.' + base64url(JSON.stringify(payload));
            const signature = crypto.sign(null, Buffer.from(unsigned), { key: keyObject, dsaEncoding: 'ieee-p1363' });
            return unsigned + '.' + base64url(signature);
          }

          async function main() {
            const appId = process.env.ASC_APP_ID;
            const res = await fetch('https://api.appstoreconnect.apple.com/v1/apps/' + appId + '/betaGroups?limit=50', {
              headers: { Authorization: 'Bearer ' + genJwt() },
            });
            const body = await res.json();
            console.log('HTTP', res.status);
            console.log(JSON.stringify(body, null, 2));
          }

          main().catch((e) => {
            console.log('::error::' + e.message);
            process.exit(1);
          });
          NODEEOF
          node /tmp/list_groups.js
