name: Debug ASC API (temporal)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Traza completa hasta el crash
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -x
          cat > /tmp/gen_jwt.js << 'JWTEOF'
          const crypto = require('crypto');
          function base64url(input) {
            return Buffer.from(input).toString('base64').replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
          }
          const keyId = process.env.ASC_API_KEY_ID;
          const issuerId = process.env.ASC_API_ISSUER_ID;
          const keyObject = crypto.createPrivateKey(process.env.ASC_API_KEY_P8);
          const header = { alg: 'ES256', kid: keyId, typ: 'JWT' };
          const now = Math.floor(Date.now() / 1000);
          const payload = { iss: issuerId, iat: now, exp: now + 1190, aud: 'appstoreconnect-v1' };
          const unsigned = base64url(JSON.stringify(header)) + '.' + base64url(JSON.stringify(payload));
          const signature = crypto.sign(null, Buffer.from(unsigned), { key: keyObject, dsaEncoding: 'ieee-p1363' });
          console.log(unsigned + '.' + base64url(signature));
          JWTEOF
          echo "MARCA_A: fichero escrito"
          wc -l /tmp/gen_jwt.js
          echo "MARCA_B: antes de node"
          JWT=$(node /tmp/gen_jwt.js)
          echo "MARCA_C: despues de node, exit=$?"
