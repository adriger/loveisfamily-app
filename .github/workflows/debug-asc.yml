name: Debug ASC API (temporal)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Asignar build al grupo externo (todo en Node)
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_APP_ID: '6773713987'
          GROUP_NAME: 'ext'
        run: |
          cat > /tmp/asc_assign.js << 'NODEEOF'
          const crypto = require('crypto');

          function base64url(input) {
            return Buffer.from(input).toString('base64').replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
          }

          function genJwt() {
            const keyObject = crypto.createPrivateKey(process.env.ASC_API_KEY_P8);
            const header = { alg: 'ES256', kid: process.env.ASC_API_KEY_ID, typ: 'JWT' };
            const now = Math.floor(Date.now() / 1000);
            const payload = { iss: process.env.ASC_API_ISSUER_ID, iat: now, exp: now + 1190, aud: 'appstoreconnect-v1' };
            const unsigned = base64url(JSON.stringify(header)) + '.' + base64url(JSON.stringify(payload));
            const signature = crypto.sign(null, Buffer.from(unsigned), { key: keyObject, dsaEncoding: 'ieee-p1363' });
            return unsigned + '.' + base64url(signature);
          }

          async function ascFetch(path) {
            const res = await fetch('https://api.appstoreconnect.apple.com' + path, {
              headers: { Authorization: 'Bearer ' + genJwt() },
            });
            const body = await res.json().catch(() => ({}));
            return { status: res.status, body };
          }

          async function ascPost(path, data) {
            const res = await fetch('https://api.appstoreconnect.apple.com' + path, {
              method: 'POST',
              headers: {
                Authorization: 'Bearer ' + genJwt(),
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(data),
            });
            const text = await res.text();
            return { status: res.status, text };
          }

          function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
          }

          async function main() {
            const appId = process.env.ASC_APP_ID;
            const groupName = process.env.GROUP_NAME;

            console.log('Esperando a que el build termine de procesar en App Store Connect...');
            let buildId = null;
            for (let i = 1; i <= 60; i++) {
              const { status, body } = await ascFetch('/v1/builds?filter[app]=' + appId + '&sort=-uploadedDate&limit=1');
              const first = body.data && body.data[0];
              const state = first ? first.attributes.processingState : 'NONE';
              const version = first ? first.attributes.version : '?';
              console.log('[' + i + '/60] http=' + status + ' build=' + version + ' processingState=' + state);
              if (state === 'VALID') {
                buildId = first.id;
                break;
              }
              await sleep(20000);
            }

            if (!buildId) {
              console.log('::error::El build no termino de procesar a tiempo');
              process.exit(1);
            }

            const groupsResp = await ascFetch('/v1/apps/' + appId + '/betaGroups?filter[name]=' + encodeURIComponent(groupName));
            const groups = groupsResp.body.data || [];
            console.log('Grupos encontrados: ' + JSON.stringify(groups.map((g) => g.attributes.name)));
            const group = groups[0];

            if (!group) {
              console.log("::error::No se encontro el grupo '" + groupName + "'");
              process.exit(1);
            }

            console.log('Asignando build ' + buildId + ' al grupo ' + groupName + ' (' + group.id + ')...');
            const assignResp = await ascPost('/v1/betaGroups/' + group.id + '/relationships/builds', {
              data: [{ type: 'builds', id: buildId }],
            });
            console.log('HTTP ' + assignResp.status);
            console.log(assignResp.text);

            if (assignResp.status !== 204) {
              process.exit(1);
            }
            console.log('Build asignado correctamente.');
          }

          main().catch((e) => {
            console.log('::error::' + e.message);
            console.log(e.stack);
            process.exit(1);
          });
          NODEEOF
          node /tmp/asc_assign.js
