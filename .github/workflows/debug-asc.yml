name: Debug ASC API (temporal)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Asignar último build al grupo externo (sin node -e inline)
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          cat > /tmp/gen_jwt.js << 'JWTEOF'
          const crypto = require('crypto');
          function base64url(input) {
            return Buffer.from(input).toString('base64').replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
          }
          const keyId = process.env.ASC_API_KEY_ID;
          const issuerId = process.env.ASC_API_ISSUER_ID;
          const keyObject = crypto.createPrivateKey(process.env.ASC_API_KEY_P8);
          const header = { alg: 'ES256', kid: keyId, typ: 'JWT' };
          const now = Math.floor(Date.now() / 1000);
          const payload = { iss: issuerId, iat: now, exp: now + 1190, aud: 'appstoreconnect-v1' };
          const unsigned = base64url(JSON.stringify(header)) + '.' + base64url(JSON.stringify(payload));
          const signature = crypto.sign(null, Buffer.from(unsigned), { key: keyObject, dsaEncoding: 'ieee-p1363' });
          console.log(unsigned + '.' + base64url(signature));
          JWTEOF

          cat > /tmp/extract.js << 'EXTEOF'
          const field = process.argv[2];
          let raw = '';
          process.stdin.on('data', c => raw += c);
          process.stdin.on('end', () => {
            let out = '';
            try {
              const j = JSON.parse(raw);
              const first = j.data && j.data[0];
              if (field === 'build.processingState') out = first ? first.attributes.processingState : 'NONE';
              else if (field === 'build.id') out = first ? first.id : '';
              else if (field === 'build.version') out = first ? first.attributes.version : '';
              else if (field === 'group.id') out = first ? first.id : '';
              else if (field === 'group.names') out = JSON.stringify((j.data || []).map(g => g.attributes.name));
            } catch (e) {
              out = field === 'build.processingState' ? ('PARSE_ERROR: ' + e.message) : '';
            }
            console.log(out);
          });
          EXTEOF

          ASC_APP_ID="6773713987"
          GROUP_NAME="ext"

          echo "Esperando a que el build termine de procesar en App Store Connect..."
          BUILD_ID=""
          for i in $(seq 1 60); do
            set +e
            JWT=$(node /tmp/gen_jwt.js 2>/tmp/node_err.txt)
            JWT_CODE=$?
            set -e
            if [ $JWT_CODE -ne 0 ]; then
              echo "intento $i: node fallo generando el JWT (exit $JWT_CODE), reintentando..."
              cat /tmp/node_err.txt
              sleep 5
              continue
            fi
            RESP=$(curl -s -H "Authorization: Bearer $JWT" "https://api.appstoreconnect.apple.com/v1/builds?filter[app]=$ASC_APP_ID&sort=-uploadedDate&limit=1")
            STATE=$(echo "$RESP" | node /tmp/extract.js build.processingState)
            ID=$(echo "$RESP" | node /tmp/extract.js build.id)
            VER=$(echo "$RESP" | node /tmp/extract.js build.version)
            echo "[$i/60] build=$VER processingState=$STATE"
            if [ "$STATE" = "VALID" ]; then
              BUILD_ID="$ID"
              break
            fi
            sleep 20
          done

          if [ -z "$BUILD_ID" ]; then
            echo "::error::El build no termino de procesar a tiempo"
            exit 1
          fi

          set +e
          JWT=$(node /tmp/gen_jwt.js 2>/tmp/node_err.txt)
          JWT_CODE=$?
          set -e
          if [ $JWT_CODE -ne 0 ]; then
            echo "::error::node fallo generando el JWT (exit $JWT_CODE)"
            cat /tmp/node_err.txt
            exit 1
          fi

          GROUP_RESP=$(curl -s -H "Authorization: Bearer $JWT" "https://api.appstoreconnect.apple.com/v1/apps/$ASC_APP_ID/betaGroups?filter[name]=$GROUP_NAME")
          GROUP_ID=$(echo "$GROUP_RESP" | node /tmp/extract.js group.id)
          GROUP_NAMES=$(echo "$GROUP_RESP" | node /tmp/extract.js group.names)
          echo "Grupos encontrados: $GROUP_NAMES"

          if [ -z "$GROUP_ID" ]; then
            echo "::error::No se encontro el grupo '$GROUP_NAME'"
            exit 1
          fi

          echo "Asignando build $BUILD_ID al grupo $GROUP_NAME ($GROUP_ID)..."
          set +e
          JWT=$(node /tmp/gen_jwt.js 2>/tmp/node_err.txt)
          JWT_CODE=$?
          set -e
          if [ $JWT_CODE -ne 0 ]; then
            echo "::error::node fallo generando el JWT (exit $JWT_CODE)"
            cat /tmp/node_err.txt
            exit 1
          fi

          HTTP_CODE=$(curl -s -o /tmp/asc_resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $JWT" -H "Content-Type: application/json" \
            "https://api.appstoreconnect.apple.com/v1/betaGroups/$GROUP_ID/relationships/builds" \
            -d "{\"data\":[{\"type\":\"builds\",\"id\":\"$BUILD_ID\"}]}")

          echo "HTTP $HTTP_CODE"
          cat /tmp/asc_resp.json
          if [ "$HTTP_CODE" != "204" ]; then
            exit 1
          fi
          echo "Build asignado correctamente."
