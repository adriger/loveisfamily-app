name: Build nativo (EAS Build)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android

jobs:
  build:
    name: EAS Build — ${{ github.event.inputs.platform }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Escribir GoogleService-Info.plist en el runner
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > GoogleService-Info.plist

      - name: Incrementar build number automáticamente
        run: |
          BUILD=$(node -e "const a=require('./app.json'); console.log(Number(a.expo.ios.buildNumber)+1)")
          VERSION_CODE=$(node -e "const a=require('./app.json'); console.log(a.expo.android.versionCode+1)")
          node -e "
            const fs=require('fs');
            const a=JSON.parse(fs.readFileSync('app.json','utf8'));
            a.expo.ios.buildNumber=String($BUILD);
            a.expo.android.versionCode=$VERSION_CODE;
            fs.writeFileSync('app.json',JSON.stringify(a,null,2));
          "
          git config user.email "ci@loveisfamily.app"
          git config user.name "LoveIsFamily CI"
          git add app.json
          git commit -m "bump: build $BUILD (auto)"
          git push

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build nativo
        run: eas build --platform ${{ github.event.inputs.platform }} --non-interactive --profile production

      - name: Subir a TestFlight
        if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' }}
        run: eas submit --platform ios --latest --non-interactive
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Asignar build al grupo externo de TestFlight
        if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' }}
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -e
          trap 'rm -f /tmp/asc_key.p8' EXIT
          echo "$ASC_API_KEY_P8" > /tmp/asc_key.p8
          chmod 600 /tmp/asc_key.p8

          cat > /tmp/gen_jwt.js << 'JWTEOF'
          const crypto = require('crypto');
          const fs = require('fs');
          function base64url(input) {
            return Buffer.from(input).toString('base64').replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
          }
          const keyId = process.env.ASC_API_KEY_ID;
          const issuerId = process.env.ASC_API_ISSUER_ID;
          const privateKey = fs.readFileSync('/tmp/asc_key.p8', 'utf8');
          const header = { alg: 'ES256', kid: keyId, typ: 'JWT' };
          const now = Math.floor(Date.now() / 1000);
          const payload = { iss: issuerId, iat: now, exp: now + 1190, aud: 'appstoreconnect-v1' };
          const unsigned = base64url(JSON.stringify(header)) + '.' + base64url(JSON.stringify(payload));
          const signature = crypto.sign(null, Buffer.from(unsigned), { key: privateKey, dsaEncoding: 'ieee-p1363' });
          console.log(unsigned + '.' + base64url(signature));
          JWTEOF

          ASC_APP_ID="6773713987"
          GROUP_NAME="ext"

          echo "Esperando a que el build termine de procesar en App Store Connect..."
          BUILD_ID=""
          for i in $(seq 1 60); do
            JWT=$(node /tmp/gen_jwt.js)
            RESP=$(curl -s -H "Authorization: Bearer $JWT" "https://api.appstoreconnect.apple.com/v1/builds?filter[app]=$ASC_APP_ID&sort=-uploadedDate&limit=1")
            STATE=$(echo "$RESP" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.data&&j.data[0]?j.data[0].attributes.processingState:'NONE')}catch(e){console.log('PARSE_ERROR')}})")
            ID=$(echo "$RESP" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.data&&j.data[0]?j.data[0].id:'')}catch(e){console.log('')}})")
            echo "[$i/60] processingState=$STATE"
            if [ "$STATE" = "VALID" ]; then
              BUILD_ID="$ID"
              break
            fi
            sleep 60
          done

          if [ -z "$BUILD_ID" ]; then
            echo "::error::El build no terminó de procesar a tiempo (timeout 60 min)"
            exit 1
          fi

          JWT=$(node /tmp/gen_jwt.js)
          GROUP_RESP=$(curl -s -H "Authorization: Bearer $JWT" "https://api.appstoreconnect.apple.com/v1/apps/$ASC_APP_ID/betaGroups?filter[name]=$GROUP_NAME")
          GROUP_ID=$(echo "$GROUP_RESP" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.data&&j.data[0]?j.data[0].id:'')}catch(e){console.log('')}})")

          if [ -z "$GROUP_ID" ]; then
            echo "::error::No se encontró el grupo '$GROUP_NAME' en App Store Connect"
            exit 1
          fi

          echo "Asignando build $BUILD_ID al grupo $GROUP_NAME ($GROUP_ID)..."
          JWT=$(node /tmp/gen_jwt.js)
          HTTP_CODE=$(curl -s -o /tmp/asc_resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $JWT" -H "Content-Type: application/json" \
            "https://api.appstoreconnect.apple.com/v1/betaGroups/$GROUP_ID/relationships/builds" \
            -d "{\"data\":[{\"type\":\"builds\",\"id\":\"$BUILD_ID\"}]}")

          if [ "$HTTP_CODE" != "204" ]; then
            echo "::error::Fallo al asignar el build (HTTP $HTTP_CODE)"
            cat /tmp/asc_resp.json
            exit 1
          fi

          echo "Build asignado correctamente al grupo externo '$GROUP_NAME'."
