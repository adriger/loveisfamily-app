name: Build nativo (EAS Build)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android

jobs:
  build:
    name: EAS Build — ${{ github.event.inputs.platform }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Escribir GoogleService-Info.plist en el runner
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > GoogleService-Info.plist

      - name: Incrementar build number automáticamente
        run: |
          BUILD=$(node -e "const a=require('./app.json'); console.log(Number(a.expo.ios.buildNumber)+1)")
          VERSION_CODE=$(node -e "const a=require('./app.json'); console.log(a.expo.android.versionCode+1)")
          node -e "
            const fs=require('fs');
            const a=JSON.parse(fs.readFileSync('app.json','utf8'));
            a.expo.ios.buildNumber=String($BUILD);
            a.expo.android.versionCode=$VERSION_CODE;
            fs.writeFileSync('app.json',JSON.stringify(a,null,2));
          "
          git config user.email "ci@loveisfamily.app"
          git config user.name "LoveIsFamily CI"
          git add app.json
          git commit -m "bump: build $BUILD (auto)"
          git push

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build nativo
        run: eas build --platform ${{ github.event.inputs.platform }} --non-interactive --profile production

      - name: Subir a TestFlight
        if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' }}
        run: eas submit --platform ios --latest --non-interactive
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Asignar build al grupo externo de TestFlight
        if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' }}
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_APP_ID: '6773713987'
          GROUP_NAME: 'ext'
        run: |
          cat > /tmp/asc_assign.js << 'NODEEOF'
          const crypto = require('crypto');

          function base64url(input) {
            return Buffer.from(input).toString('base64').replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
          }

          function genJwt() {
            const keyObject = crypto.createPrivateKey(process.env.ASC_API_KEY_P8);
            const header = { alg: 'ES256', kid: process.env.ASC_API_KEY_ID, typ: 'JWT' };
            const now = Math.floor(Date.now() / 1000);
            const payload = { iss: process.env.ASC_API_ISSUER_ID, iat: now, exp: now + 1190, aud: 'appstoreconnect-v1' };
            const unsigned = base64url(JSON.stringify(header)) + '.' + base64url(JSON.stringify(payload));
            const signature = crypto.sign(null, Buffer.from(unsigned), { key: keyObject, dsaEncoding: 'ieee-p1363' });
            return unsigned + '.' + base64url(signature);
          }

          async function ascFetch(path) {
            const res = await fetch('https://api.appstoreconnect.apple.com' + path, {
              headers: { Authorization: 'Bearer ' + genJwt() },
            });
            const body = await res.json().catch(() => ({}));
            return { status: res.status, body };
          }

          async function ascPost(path, data) {
            const res = await fetch('https://api.appstoreconnect.apple.com' + path, {
              method: 'POST',
              headers: {
                Authorization: 'Bearer ' + genJwt(),
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(data),
            });
            const text = await res.text();
            return { status: res.status, text };
          }

          function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
          }

          async function main() {
            const appId = process.env.ASC_APP_ID;
            const groupName = process.env.GROUP_NAME;

            console.log('Esperando a que el build termine de procesar en App Store Connect...');
            let buildId = null;
            for (let i = 1; i <= 60; i++) {
              const { status, body } = await ascFetch('/v1/builds?filter[app]=' + appId + '&sort=-uploadedDate&limit=1');
              const first = body.data && body.data[0];
              const state = first ? first.attributes.processingState : 'NONE';
              const version = first ? first.attributes.version : '?';
              console.log('[' + i + '/60] http=' + status + ' build=' + version + ' processingState=' + state);
              if (state === 'VALID') {
                buildId = first.id;
                break;
              }
              await sleep(60000);
            }

            if (!buildId) {
              console.log('::error::El build no termino de procesar a tiempo (timeout 60 min)');
              process.exit(1);
            }

            const groupsResp = await ascFetch('/v1/apps/' + appId + '/betaGroups?limit=50');
            const groups = groupsResp.body.data || [];
            console.log('Grupos encontrados: ' + JSON.stringify(groups.map((g) => g.attributes.name)));
            const group = groups.find((g) => g.attributes.name === groupName);

            if (!group) {
              console.log("::error::No se encontro el grupo '" + groupName + "' en App Store Connect");
              process.exit(1);
            }

            console.log('Asignando build ' + buildId + ' al grupo ' + groupName + ' (' + group.id + ')...');
            const assignResp = await ascPost('/v1/betaGroups/' + group.id + '/relationships/builds', {
              data: [{ type: 'builds', id: buildId }],
            });
            console.log('HTTP ' + assignResp.status);
            console.log(assignResp.text);

            if (assignResp.status !== 204) {
              console.log('::error::Fallo al asignar el build');
              process.exit(1);
            }
            console.log("Build asignado correctamente al grupo externo '" + groupName + "'.");
          }

          main().catch((e) => {
            console.log('::error::' + e.message);
            console.log(e.stack);
            process.exit(1);
          });
          NODEEOF
          node /tmp/asc_assign.js
